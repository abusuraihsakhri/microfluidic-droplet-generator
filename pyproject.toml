[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microfluidic-droplet-generator"
version = "2.0.0"
description = "DropletFlow: Microfluidic Flow-Focusing Droplet Generator Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
microfluidic-droplet-generator = "droplet_microfluidics.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/microfluidic-droplet-generator"
Repository = "https://github.com/abusuraihsakhri/microfluidic-droplet-generator.git"
