[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microfluidic-droplet-generator"
version = "2.0.0"
description = "DropletFlow: Microfluidic Flow-Focusing Droplet Generator Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1"]

[project.scripts]
microfluidic-droplet-generator = "droplet_microfluidics.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/microfluidic-droplet-generator"
Repository = "https://github.com/abusuraihsakhri/microfluidic-droplet-generator.git"

[tool.setuptools.packages.find]
include = ["agents*", "droplet_microfluidics*"]
